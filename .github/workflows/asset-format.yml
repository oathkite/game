name: Asset format
on:
  pull_request:
  push:
    branches: [main, codex/2d-update]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/assets/*.test.mjs tools/asset-lab/*.test.mjs
      - run: node scripts/assets/check.mjs
